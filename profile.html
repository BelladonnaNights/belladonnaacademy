<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Belladonna Academy — My Profile</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .profile-wrap { max-width:560px; margin:0 auto; padding:2rem 1.5rem 4rem; }
    .avatar { width:100px; height:100px; border-radius:50%; object-fit:cover; border:2px solid var(--gold-border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-family:var(--cinzel); font-size:32px; color:var(--text3); margin:0 auto 1.5rem; overflow:hidden; }
    .avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .field-group { margin-bottom:1.25rem; }
    .field-group label { display:block; font-family:var(--cinzel); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text3); margin-bottom:6px; }
    .field-group input { width:100%; background:var(--surface); border:1px solid var(--gold-border); border-radius:var(--radius); padding:10px 14px; color:var(--text); font-family:var(--font); font-size:14px; box-sizing:border-box; }
    .field-group input:focus { outline:none; border-color:var(--gold); }
    .tier-display { display:inline-flex; align-items:center; gap:8px; padding:6px 16px; border-radius:99px; font-family:var(--cinzel); font-size:12px; letter-spacing:.08em; border:1px solid; margin-bottom:1.5rem; }
    .tier-bronze { background:#1a1208; border-color:#cd7f32; color:#cd7f32; }
    .tier-silver { background:#111418; border-color:#a8b2be; color:#a8b2be; }
    .tier-gold   { background:#1a1508; border-color:#c9a84c; color:#c9a84c; }
    .tier-none   { background:var(--surface2); border-color:var(--border2); color:var(--text3); }
    .section-divider { border:none; border-top:1px solid var(--border); margin:2rem 0; }
    @media(max-width:480px){ .profile-wrap{padding:1rem 1rem 3rem;} }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="loading-wrap" id="loading"><div class="spinner"></div><p>Loading profile...</p></div>

  <main id="main" style="display:none;">
    <div class="profile-wrap">
      <div style="margin-bottom:1.5rem;">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">← Dashboard</a>
      </div>

      <div style="text-align:center;margin-bottom:2rem;">
        <div class="avatar" id="avatar-display">?</div>
        <div id="tier-badge-display"></div>
      </div>

      <div class="card fade-up">
        <h3 style="margin-bottom:1.5rem;font-family:var(--cinzel);font-size:14px;letter-spacing:.06em;text-transform:uppercase;">Profile Info</h3>

        <div class="field-group">
          <label>Full Name</label>
          <input type="text" id="field-name" placeholder="Your full name"/>
        </div>
        <div class="field-group">
          <label>DJ / Stage Name</label>
          <input type="text" id="field-djname" placeholder="DJ Midnight"/>
        </div>
        <div class="field-group">
          <label>Photo URL</label>
          <input type="text" id="field-photo" placeholder="https://... (link to your photo)"/>
          <p style="font-size:12px;color:var(--text3);margin-top:6px;font-style:normal;font-family:var(--font);">Paste a direct link to an image. This appears on the public host verification page.</p>
        </div>

        <div id="save-profile-error" style="display:none;margin-bottom:10px;" class="error-msg"></div>
        <button class="btn btn-primary" id="save-profile-btn" onclick="saveProfile()">Save Profile</button>
      </div>

      <hr class="section-divider"/>

      <div class="card fade-up" style="animation-delay:.1s;">
        <h3 style="margin-bottom:1.5rem;font-family:var(--cinzel);font-size:14px;letter-spacing:.06em;text-transform:uppercase;">Change Password</h3>

        <div class="field-group">
          <label>New Password</label>
          <input type="password" id="field-newpw" placeholder="Min 6 characters"/>
        </div>
        <div class="field-group">
          <label>Confirm New Password</label>
          <input type="password" id="field-confirmpw" placeholder="Repeat new password"/>
        </div>

        <div id="pw-error" style="display:none;margin-bottom:10px;" class="error-msg"></div>
        <div id="pw-success" style="display:none;margin-bottom:10px;color:var(--success);font-family:var(--font);font-size:13px;"></div>
        <button class="btn btn-ghost" id="save-pw-btn" onclick="savePassword()">Update Password</button>
      </div>
    </div>
  </main>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script type="module">
    import { requireAuth, renderNav, doLogout, db, showToast } from "./firebase-init.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    window._logout = doLogout;

    const TIER_LABELS = {
      certified_host:  { label:"🥉 Certified Host",  cls:"tier-bronze" },
      verified_host:   { label:"🥈 Verified Host",   cls:"tier-silver" },
      audio_alchemist: { label:"🥇 Audio Alchemist", cls:"tier-gold"   },
    };

    let currentUser = null;
    let userProfile = null;

    requireAuth(async (user, profile) => {
      currentUser = user;
      userProfile = profile;
      document.getElementById("nav-placeholder").innerHTML = renderNav(profile, profile.role === "admin");

      // Populate fields
      document.getElementById("field-name").value = profile.name || "";
      document.getElementById("field-djname").value = profile.djName || "";
      document.getElementById("field-photo").value = profile.photoUrl || "";

      // Avatar
      const avatar = document.getElementById("avatar-display");
      if (profile.photoUrl) {
        avatar.innerHTML = `<img src="${profile.photoUrl}" alt="${profile.name||""}"/>`;
      } else {
        avatar.textContent = (profile.name||"?").charAt(0).toUpperCase();
      }

      // Tier badge
      const tierEl = document.getElementById("tier-badge-display");
      if (profile.tier && TIER_LABELS[profile.tier]) {
        const t = TIER_LABELS[profile.tier];
        tierEl.innerHTML = `<span class="tier-display ${t.cls}">${t.label}</span>`;
      } else {
        tierEl.innerHTML = `<span class="tier-display tier-none">No tier yet</span>`;
      }

      document.getElementById("loading").style.display = "none";
      document.getElementById("main").style.display = "block";
    });

    window.saveProfile = async function() {
      const name = document.getElementById("field-name").value.trim();
      const djName = document.getElementById("field-djname").value.trim();
      const photoUrl = document.getElementById("field-photo").value.trim();
      const errEl = document.getElementById("save-profile-error");
      const btn = document.getElementById("save-profile-btn");
      errEl.style.display = "none";

      if (!name) { errEl.textContent = "Name is required."; errEl.style.display = "block"; return; }

      btn.textContent = "Saving..."; btn.disabled = true;
      try {
        await setDoc(doc(db,"users",currentUser.uid), {name, djName, photoUrl}, {merge:true});

        // Update avatar preview
        const avatar = document.getElementById("avatar-display");
        if (photoUrl) {
          avatar.innerHTML = `<img src="${photoUrl}" alt="${name}"/>`;
        } else {
          avatar.textContent = name.charAt(0).toUpperCase();
        }

        showToast("Profile saved!", "success");
      } catch(e) {
        errEl.textContent = "Save failed: " + e.message;
        errEl.style.display = "block";
      } finally {
        btn.textContent = "Save Profile"; btn.disabled = false;
      }
    };

    window.savePassword = async function() {
      const newPw = document.getElementById("field-newpw").value;
      const confirmPw = document.getElementById("field-confirmpw").value;
      const errEl = document.getElementById("pw-error");
      const successEl = document.getElementById("pw-success");
      const btn = document.getElementById("save-pw-btn");
      errEl.style.display = "none"; successEl.style.display = "none";

      if (!newPw) { errEl.textContent = "Enter a new password."; errEl.style.display = "block"; return; }
      if (newPw.length < 6) { errEl.textContent = "Password must be at least 6 characters."; errEl.style.display = "block"; return; }
      if (newPw !== confirmPw) { errEl.textContent = "Passwords don't match."; errEl.style.display = "block"; return; }

      btn.textContent = "Updating..."; btn.disabled = true;
      try {
        const auth = getAuth();
        await updatePassword(auth.currentUser, newPw);
        // Save new password to Firestore so admin can see it
        await setDoc(doc(db,"users",currentUser.uid), {tempPassword: newPw}, {merge:true});
        document.getElementById("field-newpw").value = "";
        document.getElementById("field-confirmpw").value = "";
        successEl.textContent = "Password updated successfully.";
        successEl.style.display = "block";
        showToast("Password updated!", "success");
      } catch(e) {
        let msg = e.message;
        if (e.code === "auth/requires-recent-login") {
          msg = "For security, please sign out and sign back in before changing your password.";
        }
        errEl.textContent = msg; errEl.style.display = "block";
      } finally {
        btn.textContent = "Update Password"; btn.disabled = false;
      }
    };
  </script>
</body>
</html>
